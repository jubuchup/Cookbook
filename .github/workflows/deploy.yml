name: Deploy to GitHub Pages

# Runs automatically whenever main changes (e.g. after merging a sync PR,
# or after editing site/index.html). Publishes /site as the Pages site.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy DuckDB data file into the site bundle
        # site/index.html fetches ../data/tracker.duckdb using a relative
        # path when run locally, but Pages serves only the uploaded
        # artifact - so bundle data/tracker.duckdb alongside site/ before
        # uploading. Keeps a single source file (data/tracker.duckdb)
        # instead of maintaining two committed copies.
        run: |
          mkdir -p site/data
          cp data/tracker.duckdb site/data/tracker.duckdb

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
