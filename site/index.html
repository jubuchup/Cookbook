<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Recipe Tracker</title>

<!-- iOS "Add to Home Screen" icon + standalone app behavior -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cookbook" />
<meta name="theme-color" content="#faf7f1" />

<!-- Generic favicon + Android/PWA icons -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root {
    color-scheme: light;
    --bg: #faf7f1;
    --panel: #ffffff;
    --border: #e8e2d6;
    --text: #262420;
    --muted: #7c7566;
    --accent: #c05a2e;
    --accent-soft: #f4e3d6;
    --green: #3f6b4a;
    --green-soft: #e6efe8;
    --trial: #c98a1f;
    --trial-soft: #f6ead1;
    --retired: #9a9284;
    --retired-soft: #eeece7;
    --display-font: "Iowan Old Style", "Georgia", serif;
    --sidebar-bg: #22301f;
    --sidebar-text: #eef1e8;
    --sidebar-muted: #a9b39c;
    --shadow: 0 1px 2px rgba(38,36,32,0.04), 0 4px 14px rgba(38,36,32,0.06);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  a { color: inherit; }

  /* ---------- App shell: sidebar (desktop) + content ---------- */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    display: none;
    flex-direction: column;
    width: 240px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 24px 16px calc(20px + var(--safe-bottom));
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .sidebar .brand {
    font-size: 1.15rem;
    font-weight: 700;
    padding: 4px 10px 22px;
    letter-spacing: -0.01em;
  }
  .sidebar .brand .accent-dot { color: #e6a15b; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--sidebar-muted);
    cursor: pointer;
    text-decoration: none;
    user-select: none;
  }
  .sidebar .nav-item .icon { font-size: 1rem; width: 20px; text-align: center; }
  .sidebar .nav-item.active {
    background: rgba(255,255,255,0.1);
    color: var(--sidebar-text);
  }
  .sidebar .nav-item:not(.active):hover { color: var(--sidebar-text); }
  .sidebar .nav-footer {
    margin-top: auto;
    font-size: 0.72rem;
    color: var(--sidebar-muted);
    padding: 10px 12px 0;
  }

  .content-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  header.topbar {
    padding: calc(20px + var(--safe-top)) 20px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header.topbar h1 {
    margin: 0 0 2px;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header.topbar p { margin: 0; color: var(--muted); font-size: 0.87rem; }

  main {
    max-width: 1080px;
    width: 100%;
    margin: 0 auto;
    padding: 18px 20px calc(60px + var(--safe-bottom));
    flex: 1;
  }
  #status-line { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
  #status-line.error { color: #b3261e; }
  #status-line:empty { display: none; }

  /* ---------- Status tabs (primary filter) ---------- */
  .status-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .status-tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .status-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: 0.5; }
  .status-tab.active { background: var(--text); color: #fff; border-color: var(--text); }
  .status-tab.active .dot { opacity: 1; }
  .status-tab:not(.active):hover { border-color: var(--text); color: var(--text); }

  /* ---------- Needs-a-decision nudge ---------- */
  .nudge-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--trial-soft);
    border: 1px solid var(--trial);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 0.88rem;
    color: #7a5813;
  }
  .nudge-banner .nudge-icon { font-size: 1.1rem; flex-shrink: 0; }
  .nudge-banner .nudge-text { flex: 1; }
  .nudge-banner .nudge-text b { color: var(--text); }
  .nudge-banner .nudge-action {
    flex-shrink: 0;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--trial);
    background: var(--panel);
    border: 1px solid var(--trial);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .nudge-banner .nudge-action:hover { background: var(--trial); color: #fff; }

  /* ---------- Secondary filters (category / ingredient) ---------- */
  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .filters select, .filters input[type="search"] {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    font-size: 0.92rem;
    color: var(--text);
    min-height: 40px;
  }
  .filters input[type="search"] { flex: 1 1 200px; min-width: 160px; }
  .filters select { flex: 0 1 auto; }

  /* ---------- Recipe card grid ---------- */
  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .recipe-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--retired);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
  }
  .recipe-card[data-status="core"] { border-left-color: var(--green); }
  .recipe-card[data-status="trial"] { border-left-color: var(--trial); }
  .recipe-card[data-status="retired"] { border-left-color: var(--retired); }
  .recipe-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(38,36,32,0.06), 0 10px 24px rgba(38,36,32,0.1); }
  .recipe-card:active { transform: translateY(0); }

  .card-image {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, var(--accent-soft), #ece2d2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: var(--accent);
    position: relative;
    overflow: hidden;
  }
  .card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .veggie-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255,255,255,0.92);
    color: var(--green);
    border-radius: 999px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    box-shadow: var(--shadow);
  }

  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-body .name { font-weight: 600; font-size: 0.98rem; line-height: 1.3; font-family: var(--display-font); }
  .card-body .meta { font-size: 0.78rem; color: var(--muted); }

  .card-macros {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .card-macros .m { text-align: center; }
  .card-macros .m .v { font-size: 0.86rem; font-weight: 700; color: var(--text); }
  .card-macros .m .l { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }

  .empty-state { color: var(--muted); padding: 32px 4px; text-align: center; }

  /* ---------- Detail view ---------- */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 500;
  }
  .back-link:hover { text-decoration: underline; }

  .detail-hero {
    width: 100%;
    max-height: 340px;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--accent-soft), #ece2d2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.6rem;
    color: var(--accent);
    margin-bottom: 18px;
    border-top: 4px solid var(--retired);
  }
  .detail-hero[data-status="core"] { border-top-color: var(--green); }
  .detail-hero[data-status="trial"] { border-top-color: var(--trial); }
  .detail-hero[data-status="retired"] { border-top-color: var(--retired); }
  .detail-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .detail-header { margin-bottom: 4px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .detail-header h2 { margin: 0; font-size: 1.7rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; font-family: var(--display-font); }
  .veggie-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.72rem; font-weight: 600; color: var(--green);
    background: var(--green-soft); border-radius: 999px; padding: 3px 9px;
  }
  .status-badge {
    display: inline-flex; align-items: center;
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    border-radius: 999px; padding: 4px 10px;
  }
  .status-badge[data-status="core"] { background: var(--green-soft); color: var(--green); }
  .status-badge[data-status="trial"] { background: var(--trial-soft); color: var(--trial); }
  .status-badge[data-status="retired"] { background: var(--retired-soft); color: var(--muted); }
  .detail-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }

  .action-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 40px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  .macro-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .macro-box {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
  }
  .macro-box .value { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
  .macro-box .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

  section.block { margin-bottom: 24px; }
  section.block h3 { font-size: 1.15rem; margin: 0 0 10px; color: var(--text); font-weight: 600; font-family: var(--display-font); }

  table.ingredients { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.ingredients th, table.ingredients td {
    text-align: left;
    padding: 8px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.ingredients th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
  table.ingredients td.num, table.ingredients th.num { text-align: right; }

  .tag-chip {
    display: inline-flex; align-items: center;
    font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
    border-radius: 999px; padding: 2px 7px; margin-left: 4px;
  }
  .tag-chip.tag-protein { background: var(--green-soft); color: var(--green); }
  .tag-chip.tag-carbs { background: var(--trial-soft); color: var(--trial); }
  .tag-chip.tag-fat { background: var(--accent-soft); color: var(--accent); }

  ol.steps { padding-left: 22px; margin: 0; }
  ol.steps li { margin-bottom: 10px; }
  ol.steps strong { color: var(--accent); font-weight: 700; }

  .notes-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.9rem;
    color: var(--muted);
  }

  /* ---------- Exportable recipe card (rasterized to PNG, zine style) ----------
     Rendered off-screen (not display:none - html2canvas can't rasterize that)
     then captured with html2canvas and shared/downloaded. Deliberately styled
     independently of the on-screen detail view so it reads as a printable
     card/zine rather than a screenshot of the app chrome. */
  #export-root {
    position: fixed;
    top: 0;
    left: -9999px;
    width: 640px;
    z-index: -1;
  }
  .export-card {
    width: 640px;
    box-sizing: border-box;
    background: var(--bg);
    border: 3px solid var(--text);
    border-radius: 22px;
    padding: 34px 38px 30px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    position: relative;
  }
  .export-card::before {
    content: "";
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 1px solid var(--accent);
    border-radius: 16px;
    pointer-events: none;
  }
  .export-card .ec-kicker {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .export-card h1 {
    font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-size: 2rem;
    line-height: 1.15;
    margin: 0 0 8px;
    color: var(--text);
  }
  .export-card .ec-sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .export-card .ec-veggie {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--green);
    background: var(--green-soft);
    border-radius: 999px;
    padding: 2px 9px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .export-card .ec-macros {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 26px;
  }
  .export-card .ec-macros div {
    text-align: center;
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 10px 4px;
  }
  .export-card .ec-macros .v {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--accent);
    display: block;
  }
  .export-card .ec-macros .l {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .export-card h2 {
    font-family: "Iowan Old Style", Georgia, serif;
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 10px;
    color: var(--green);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .export-card .ec-section { margin-bottom: 22px; }
  .export-card ul.ec-ingredients { list-style: none; margin: 0; padding: 0; }
  .export-card ul.ec-ingredients li {
    font-size: 0.86rem;
    padding: 5px 0 5px 22px;
    position: relative;
    border-bottom: 1px dashed var(--border);
  }
  .export-card ul.ec-ingredients li::before {
    content: "";
    position: absolute;
    left: 0; top: 9px;
    width: 10px; height: 10px;
    border: 2px solid var(--green);
    border-radius: 3px;
  }
  .export-card ol.ec-steps {
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: ec-step;
  }
  .export-card ol.ec-steps li {
    counter-increment: ec-step;
    font-size: 0.86rem;
    line-height: 1.5;
    margin-bottom: 10px;
    padding-left: 30px;
    position: relative;
  }
  .export-card ol.ec-steps li::before {
    content: counter(ec-step);
    position: absolute;
    left: 0; top: 0;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--text);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .export-card ol.ec-steps strong { color: var(--accent); font-weight: 700; }
  .export-card .ec-notes {
    font-size: 0.82rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .export-card .ec-footer {
    margin-top: 6px;
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .export-card .ec-footer .accent-dot { color: var(--accent); }

  /* ---------- Responsive: desktop sidebar on, mobile off ---------- */
  @media (min-width: 900px) {
    .sidebar { display: flex; }
    main { padding-top: 28px; }
    header.topbar { display: none; }
  }
  @media (max-width: 899px) {
    .recipe-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .macro-row { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .macro-box { padding: 8px 4px; }
    .macro-box .value { font-size: 0.95rem; }
    .action-row { flex-wrap: wrap; }
  }
  @media (max-width: 420px) {
    .recipe-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Cookbook<span class="accent-dot">.</span></div>
    <nav>
      <a class="nav-item active" href="#/"><span class="icon">&#8962;</span> Home</a>
    </nav>
    <div class="nav-footer">Synced from Google Sheets</div>
  </aside>

  <div class="content-col">
    <header class="topbar">
      <h1>Recipe Tracker</h1>
      <p>Synced from Google Sheets, queried live in your browser.</p>
    </header>

    <main>
      <div id="status-line">Loading database&hellip;</div>
      <div id="app"></div>
    </main>
  </div>
</div>

<div id="export-root"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script type="module">
import * as duckdb from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.32.0/+esm";

const statusEl = document.getElementById("status-line");
const appEl = document.getElementById("app");
const exportRootEl = document.getElementById("export-root");

let conn = null; // duckdb-wasm connection, set once the DB has loaded

/**
 * Locate the tracker.duckdb file relative to this page.
 * - On GitHub Pages, deploy.yml copies data/tracker.duckdb into site/data/
 *   before publishing, so "data/tracker.duckdb" resolves correctly there.
 * - When opening site/index.html directly from a local checkout (e.g. via
 *   `python -m http.server` from the repo root), the file instead lives at
 *   "../data/tracker.duckdb". We try the Pages-relative path first and fall
 *   back to the repo-relative path so the same file works in both setups.
 */
const DB_CANDIDATE_PATHS = ["data/tracker.duckdb", "../data/tracker.duckdb"];

async function fetchFirstAvailable(paths) {
  for (const path of paths) {
    try {
      const res = await fetch(path);
      if (res.ok) return await res.arrayBuffer();
    } catch (_) {
      // try next candidate
    }
  }
  throw new Error(
    "Could not find tracker.duckdb at any expected path (" + paths.join(", ") + ")"
  );
}

async function initDatabase() {
  const bundles = duckdb.getJsDelivrBundles();
  const bundle = await duckdb.selectBundle(bundles);

  const workerUrl = URL.createObjectURL(
    new Blob([`importScripts("${bundle.mainWorker}");`], { type: "text/javascript" })
  );
  const worker = new Worker(workerUrl);
  const logger = new duckdb.ConsoleLogger();
  const db = new duckdb.AsyncDuckDB(logger, worker);
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(workerUrl);

  const buffer = await fetchFirstAvailable(DB_CANDIDATE_PATHS);
  await db.registerFileBuffer("tracker.duckdb", new Uint8Array(buffer));

  const connection = await db.connect();
  // Attach the pre-built file as a read-only catalog rather than loading it
  // as the default in-memory DB, since ATTACH is the documented way
  // duckdb-wasm opens an existing on-disk .duckdb file.
  await connection.query(`ATTACH 'tracker.duckdb' AS tracker (READ_ONLY)`);
  await connection.query(`USE tracker`);

  return connection;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function macroBox(value, label) {
  const v = value === null || value === undefined ? "—" : Math.round(value);
  return `<div class="macro-box"><div class="value">${v}</div><div class="label">${label}</div></div>`;
}

function cardMacro(value, label) {
  const v = value === null || value === undefined ? "—" : Math.round(value);
  return `<div class="m"><div class="v">${v}</div><div class="l">${label}</div></div>`;
}

function cardImageHtml(imageUrl) {
  return imageUrl
    ? `<img src="${escapeHtml(imageUrl)}" alt="" loading="lazy" onerror="this.closest('.card-image').innerHTML='&#127860;'" />`
    : "&#127860;";
}

// ---------- List view ----------

let allRecipes = [];          // recipe_id, name, category, status, macros, is_vegetarian, image_url
let recipeIngredients = {};   // recipe_id -> Set of lowercase ingredient names
let allIngredientNames = [];  // sorted distinct ingredient names, for the filter dropdown
let currentStatus = "all";
let currentCategory = "all";
let currentIngredient = "all";
let currentSearch = "";

async function loadRecipeList() {
  const result = await conn.query(`
    SELECT
      r.recipe_id, r.name, r.category, r.status, r.is_vegetarian, r.image_url,
      COALESCE(t.total_kcal, r.sheet_total_kcal)       AS total_kcal,
      COALESCE(t.total_protein, r.sheet_total_protein) AS total_protein,
      COALESCE(t.total_carbs, r.sheet_total_carbs)      AS total_carbs,
      COALESCE(t.total_fat, r.sheet_total_fat)          AS total_fat
    FROM recipes r
    LEFT JOIN recipe_totals t USING (recipe_id)
    ORDER BY
      CASE r.status WHEN 'core' THEN 0 WHEN 'trial' THEN 1 ELSE 2 END,
      r.name
  `);
  allRecipes = result.toArray().map((row) => row.toJSON());

  const ingredientRows = (await conn.query(`SELECT recipe_id, ingredient_name FROM ingredients`))
    .toArray()
    .map((row) => row.toJSON());

  recipeIngredients = {};
  const namesSet = new Set();
  for (const row of ingredientRows) {
    const name = (row.ingredient_name || "").trim();
    if (!name) continue;
    namesSet.add(name);
    if (!recipeIngredients[row.recipe_id]) recipeIngredients[row.recipe_id] = new Set();
    recipeIngredients[row.recipe_id].add(name.toLowerCase());
  }
  allIngredientNames = Array.from(namesSet).sort((a, b) => a.localeCompare(b));
}

function populateCategoryOptions() {
  const select = document.getElementById("category-filter");
  if (!select) return;
  const categories = Array.from(
    new Set(allRecipes.map((r) => r.category).filter(Boolean))
  ).sort();
  const current = select.value;
  select.innerHTML =
    `<option value="all">All categories</option>` +
    categories.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  if (categories.includes(current)) select.value = current;
}

function populateIngredientOptions() {
  const select = document.getElementById("ingredient-filter");
  if (!select) return;
  const current = select.value;
  select.innerHTML =
    `<option value="all">Any ingredient</option>` +
    allIngredientNames.map((n) => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("");
  if (allIngredientNames.includes(current)) select.value = current;
}

function filteredRecipes() {
  const search = currentSearch.trim().toLowerCase();
  const ingredient = currentIngredient !== "all" ? currentIngredient.toLowerCase() : null;
  return allRecipes.filter((r) => {
    if (currentStatus !== "all" && r.status !== currentStatus) return false;
    if (currentCategory !== "all" && r.category !== currentCategory) return false;
    if (search && !(r.name || "").toLowerCase().includes(search)) return false;
    if (ingredient) {
      const set = recipeIngredients[r.recipe_id];
      if (!set || !set.has(ingredient)) return false;
    }
    return true;
  });
}

function needsDecisionNudge() {
  // Count-based half of the spec's "needs a decision" condition (§3c): the
  // time-based half (no promote/retire in 2+ weeks) isn't implementable yet
  // because the current Sheet/DuckDB schema has no status-changed timestamp
  // column - only today's status, not history. Scoped down to count-only
  // per the spec's own flagged Open Question (count vs. time vs. both).
  const trialCount = allRecipes.filter((r) => r.status === "trial").length;
  return trialCount >= 3 ? trialCount : 0;
}

function renderListView() {
  const rows = filteredRecipes();
  const trialCount = needsDecisionNudge();

  const nudgeHtml = trialCount
    ? `
      <div class="nudge-banner">
        <span class="nudge-icon">&#9203;</span>
        <span class="nudge-text">Your <b>trial pile</b> has <b>${trialCount} recipes</b> waiting on a call &mdash; promote the ones that stuck, retire the ones that didn't.</span>
        <button class="nudge-action" id="nudge-view-trial">Review trial</button>
      </div>`
    : "";

  const gridHtml = rows.length
    ? `<ul class="recipe-grid">` +
      rows
        .map(
          (r) => `
        <li class="recipe-card" data-recipe-id="${escapeHtml(r.recipe_id)}" data-status="${escapeHtml(r.status || "")}">
          <div class="card-image">
            ${cardImageHtml(r.image_url)}
            ${r.is_vegetarian ? `<span class="veggie-badge" title="Vegetarian">&#127807;</span>` : ""}
          </div>
          <div class="card-body">
            <div class="name">${escapeHtml(r.name)}</div>
            <div class="meta">${escapeHtml(r.category || "")}</div>
            <div class="card-macros">
              ${cardMacro(r.total_kcal, "kcal")}
              ${cardMacro(r.total_protein, "protein")}
              ${cardMacro(r.total_carbs, "carbs")}
              ${cardMacro(r.total_fat, "fat")}
            </div>
          </div>
        </li>`
        )
        .join("") +
      `</ul>`
    : `<div class="empty-state">No recipes match the current filters.</div>`;

  function tab(status, label) {
    const active = currentStatus === status;
    return `<button class="status-tab${active ? " active" : ""}" data-status="${status}"><span class="dot"></span>${label}</button>`;
  }

  appEl.innerHTML = `
    ${nudgeHtml}
    <div class="status-tabs">
      ${tab("all", "All")}
      ${tab("core", "Core")}
      ${tab("trial", "Trial")}
      ${tab("retired", "Retired")}
    </div>
    <div class="filters">
      <input type="search" id="search-input" placeholder="Search by name&hellip;" value="${escapeHtml(currentSearch)}" />
      <select id="category-filter">
        <option value="all">All categories</option>
      </select>
      <select id="ingredient-filter">
        <option value="all">Any ingredient</option>
      </select>
    </div>
    ${gridHtml}
  `;

  populateCategoryOptions();
  document.getElementById("category-filter").value = currentCategory;
  populateIngredientOptions();
  document.getElementById("ingredient-filter").value = currentIngredient;

  document.getElementById("search-input").addEventListener("input", (e) => {
    currentSearch = e.target.value;
    renderListView();
  });
  document.querySelectorAll(".status-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentStatus = btn.dataset.status;
      renderListView();
    });
  });
  const nudgeBtn = document.getElementById("nudge-view-trial");
  if (nudgeBtn) {
    nudgeBtn.addEventListener("click", () => {
      currentStatus = "trial";
      renderListView();
    });
  }
  document.getElementById("category-filter").addEventListener("change", (e) => {
    currentCategory = e.target.value;
    renderListView();
  });
  document.getElementById("ingredient-filter").addEventListener("change", (e) => {
    currentIngredient = e.target.value;
    renderListView();
  });

  document.querySelectorAll(".recipe-card").forEach((card) => {
    card.addEventListener("click", () => {
      window.location.hash = `#/recipe/${card.dataset.recipeId}`;
    });
  });
}

// ---------- Detail view ----------

// Ingredient tag chip (Protein/Carb/Fat), colored by macro type per §3b/§4:
// no explicit "macro type" column exists on ingredients, so the dominant
// macro is inferred from which of protein/carbs/fat contributes the most
// kcal for that row (protein & carbs 4 kcal/g, fat 9 kcal/g).
function dominantMacroChip(i) {
  const p = Number(i.protein) || 0;
  const c = Number(i.carbs) || 0;
  const f = Number(i.fat) || 0;
  if (p === 0 && c === 0 && f === 0) return "";
  const pKcal = p * 4, cKcal = c * 4, fKcal = f * 9;
  const max = Math.max(pKcal, cKcal, fKcal);
  if (max === 0) return "";
  if (max === pKcal) return `<span class="tag-chip tag-protein">Protein</span>`;
  if (max === cKcal) return `<span class="tag-chip tag-carbs">Carb</span>`;
  return `<span class="tag-chip tag-fat">Fat</span>`;
}

function statusVerbCta(status) {
  if (status === "trial") return { label: "Mark as core", target: "core" };
  if (status === "core") return { label: "Retire", target: "retired" };
  return { label: "Move to trial", target: "trial" };
}

function boldIngredientsInStep(stepText, ingredientNames) {
  // Escape the raw text first, then wrap ingredient-name matches in <strong>.
  // Longest names first so e.g. "greek yogurt" is matched before "yogurt".
  let html = escapeHtml(stepText);
  const sorted = [...ingredientNames].filter(Boolean).sort((a, b) => b.length - a.length);
  for (const name of sorted) {
    const escapedName = escapeHtml(name);
    const pattern = new RegExp(`(?<![\\w])(${escapeRegExp(escapedName)})(?![\\w])`, "gi");
    html = html.replace(pattern, "<strong>$1</strong>");
  }
  return html;
}

async function renderDetailView(recipeId) {
  appEl.innerHTML = `<div class="empty-state">Loading recipe&hellip;</div>`;

  // duckdb-wasm's connection.query() only takes a single SQL string - use
  // a prepared statement for parameter binding (avoids string-interpolating
  // user-controlled values into SQL, even though recipeId here only ever
  // comes from our own URL hash router).
  const recipeStmt = await conn.prepare(`
    SELECT
      r.recipe_id, r.name, r.category, r.status, r.servings, r.prep_time, r.steps, r.notes,
      r.is_vegetarian, r.image_url,
      COALESCE(t.total_kcal, r.sheet_total_kcal)       AS total_kcal,
      COALESCE(t.total_protein, r.sheet_total_protein) AS total_protein,
      COALESCE(t.total_carbs, r.sheet_total_carbs)      AS total_carbs,
      COALESCE(t.total_fat, r.sheet_total_fat)          AS total_fat
    FROM recipes r
    LEFT JOIN recipe_totals t USING (recipe_id)
    WHERE r.recipe_id = ?
  `);
  const recipeResult = await recipeStmt.query(recipeId);
  await recipeStmt.close();
  const recipeRows = recipeResult.toArray().map((row) => row.toJSON());

  if (recipeRows.length === 0) {
    appEl.innerHTML = `
      <a class="back-link" href="#/">&larr; Back to all recipes</a>
      <div class="empty-state">Recipe "${escapeHtml(recipeId)}" was not found.</div>
    `;
    return;
  }
  const recipe = recipeRows[0];

  const ingredientsStmt = await conn.prepare(`
    SELECT ingredient_name, amount, unit, kcal, protein, carbs, fat
    FROM ingredients
    WHERE recipe_id = ?
    ORDER BY ingredient_name
  `);
  const ingredientsResult = await ingredientsStmt.query(recipeId);
  await ingredientsStmt.close();
  const ingredients = ingredientsResult.toArray().map((row) => row.toJSON());
  const ingredientNames = ingredients.map((i) => i.ingredient_name).filter(Boolean);

  const steps = (recipe.steps || "")
    .split(/(?:\r?\n)+|(?=\d+\.\s)/)
    .map((s) => s.replace(/^\d+\.\s*/, "").trim())
    .filter(Boolean);

  const stepsHtmlList = steps.map((s) => `<li>${boldIngredientsInStep(s, ingredientNames)}</li>`);
  const stepsHtml = steps.length
    ? `<ol class="steps">${stepsHtmlList.join("")}</ol>`
    : `<div class="empty-state">No steps recorded.</div>`;

  const ingredientsHtml = ingredients.length
    ? `
      <table class="ingredients">
        <thead>
          <tr><th>Ingredient</th><th class="num">Amount</th><th class="num">Kcal</th><th class="num">Protein</th><th class="num">Carbs</th><th class="num">Fat</th></tr>
        </thead>
        <tbody>
          ${ingredients
            .map(
              (i) => `
            <tr>
              <td>${escapeHtml(i.ingredient_name)}${dominantMacroChip(i)}</td>
              <td class="num">${escapeHtml(i.amount)} ${escapeHtml(i.unit)}</td>
              <td class="num">${i.kcal ?? "—"}</td>
              <td class="num">${i.protein ?? "—"}</td>
              <td class="num">${i.carbs ?? "—"}</td>
              <td class="num">${i.fat ?? "—"}</td>
            </tr>`
            )
            .join("")}
        </tbody>
      </table>`
    : `<div class="empty-state">No ingredients recorded.</div>`;

  const heroHtml = recipe.image_url
    ? `<img src="${escapeHtml(recipe.image_url)}" alt="" onerror="this.closest('.detail-hero').innerHTML='&#127860;'" />`
    : "&#127860;";

  const statusAction = statusVerbCta(recipe.status);

  appEl.innerHTML = `
    <a class="back-link" href="#/">&larr; Back to all recipes</a>
    <div class="detail-hero" data-status="${escapeHtml(recipe.status || "")}">${heroHtml}</div>
    <div class="detail-header">
      <h2>${escapeHtml(recipe.name)}</h2>
      <span class="status-badge" data-status="${escapeHtml(recipe.status || "")}">${escapeHtml(recipe.status || "")}</span>
      ${recipe.is_vegetarian ? `<span class="veggie-pill">&#127807; Vegetarian</span>` : ""}
    </div>
    <div class="detail-sub">
      ${escapeHtml(recipe.category || "")} &middot; ${escapeHtml(recipe.servings || "?")} serving(s) &middot; ${escapeHtml(recipe.prep_time || "")}
    </div>

    <div class="action-row">
      <button class="btn primary" id="status-cta-btn">${escapeHtml(statusAction.label)}</button>
      <button class="btn" id="export-btn">&#128190; Save recipe card</button>
    </div>

    <div class="macro-row">
      ${macroBox(recipe.total_kcal, "kcal")}
      ${macroBox(recipe.total_protein, "protein (g)")}
      ${macroBox(recipe.total_carbs, "carbs (g)")}
      ${macroBox(recipe.total_fat, "fat (g)")}
    </div>

    <section class="block">
      <h3>Steps</h3>
      ${stepsHtml}
    </section>

    <section class="block">
      <h3>Ingredients</h3>
      ${ingredientsHtml}
    </section>

    ${
      recipe.notes
        ? `<section class="block"><h3>Notes</h3><div class="notes-box">${escapeHtml(recipe.notes)}</div></section>`
        : ""
    }
  `;

  document.getElementById("export-btn").addEventListener("click", (evt) => {
    exportRecipeCard(recipe, ingredients, stepsHtmlList, evt.currentTarget);
  });

  document.getElementById("status-cta-btn").addEventListener("click", () => {
    // The tracker is a read-only view of the Google Sheet (DuckDB is
    // ATTACHed READ_ONLY) - there's no write path from the browser back to
    // the Sheet, so the status-verb CTA can't flip the status in place yet.
    // Surface the actual next step instead of a silent no-op.
    alert(
      `To ${statusAction.label.toLowerCase()} "${recipe.name}", change its Status ` +
      `column to "${statusAction.target}" in the Google Sheet - the change will ` +
      `show up here after the next sync.`
    );
  });
}

/**
 * Builds the off-screen zine-style export card, rasterizes it with
 * html2canvas, and hands the resulting PNG to the user.
 *
 * window.print() previously drove this feature, but it is a no-op when the
 * site is launched from the iOS home screen (standalone display mode has no
 * browser chrome, so there is no print dialog for it to open). Rendering to
 * an image and using the Web Share API (falling back to a direct <a download>
 * link) works in both standalone and regular-browser contexts.
 */
async function exportRecipeCard(recipe, ingredients, stepsHtmlList, triggerBtn) {
  const originalLabel = triggerBtn.innerHTML;
  triggerBtn.disabled = true;
  triggerBtn.innerHTML = "&#8987; Preparing&hellip;";

  try {
    renderExportCard(recipe, ingredients, stepsHtmlList);
    // Let the browser lay out/paint the off-screen node before capturing it.
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    const cardNode = exportRootEl.querySelector(".export-card");
    const canvas = await html2canvas(cardNode, {
      scale: 2,
      backgroundColor: "#faf7f1",
      useCORS: true,
    });

    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    const fileName = `${slugify(recipe.name) || "recipe"}.png`;
    const file = new File([blob], fileName, { type: "image/png" });

    // Web Share API (with file support) is what actually works from an iOS
    // home-screen PWA - it hands off to the native share sheet, which offers
    // Save Image / AirDrop / Files, etc. Regular desktop/Android browsers
    // that lack file-sharing support fall back to a plain download link.
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: recipe.name || "Recipe",
      });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
  } catch (err) {
    // AbortError fires when the user just dismisses the native share sheet -
    // that's a normal cancel, not a failure worth surfacing.
    if (err && err.name !== "AbortError") {
      console.error("Recipe card export failed:", err);
      alert("Sorry, couldn't create the recipe card image. Please try again.");
    }
  } finally {
    exportRootEl.innerHTML = "";
    triggerBtn.disabled = false;
    triggerBtn.innerHTML = originalLabel;
  }
}

function slugify(str) {
  return String(str || "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function renderExportCard(recipe, ingredients, stepsHtmlList) {
  const ingredientsLi = ingredients
    .map((i) => `<li>${escapeHtml(i.amount)} ${escapeHtml(i.unit)} ${escapeHtml(i.ingredient_name)}</li>`)
    .join("");
  exportRootEl.innerHTML = `
    <div class="export-card">
      <div class="ec-kicker">Cookbook &middot; Recipe Card</div>
      <h1>${escapeHtml(recipe.name)}${recipe.is_vegetarian ? `<span class="ec-veggie">&#127807; Vegetarian</span>` : ""}</h1>
      <div class="ec-sub">
        ${escapeHtml(recipe.category || "")} &middot; ${escapeHtml(recipe.servings || "?")} serving(s) &middot; ${escapeHtml(recipe.prep_time || "")}
      </div>
      <div class="ec-macros">
        <div><span class="v">${Math.round(recipe.total_kcal ?? 0)}</span><span class="l">kcal</span></div>
        <div><span class="v">${Math.round(recipe.total_protein ?? 0)}g</span><span class="l">protein</span></div>
        <div><span class="v">${Math.round(recipe.total_carbs ?? 0)}g</span><span class="l">carbs</span></div>
        <div><span class="v">${Math.round(recipe.total_fat ?? 0)}g</span><span class="l">fat</span></div>
      </div>
      <div class="ec-section">
        <h2>Ingredients</h2>
        <ul class="ec-ingredients">${ingredientsLi}</ul>
      </div>
      <div class="ec-section">
        <h2>Steps</h2>
        <ol class="ec-steps">${stepsHtmlList.join("")}</ol>
      </div>
      ${
        recipe.notes
          ? `<div class="ec-section"><h2>Notes</h2><div class="ec-notes">${escapeHtml(recipe.notes)}</div></div>`
          : ""
      }
      <div class="ec-footer">Cookbook<span class="accent-dot">.</span> personal recipe tracker</div>
    </div>
  `;
}

// ---------- Routing ----------

function currentRoute() {
  // Hash format: "#/" for list, "#/recipe/R001" for detail.
  const hash = window.location.hash || "#/";
  const match = hash.match(/^#\/recipe\/(.+)$/);
  return match ? { view: "detail", recipeId: decodeURIComponent(match[1]) } : { view: "list" };
}

async function renderRoute() {
  const route = currentRoute();
  if (route.view === "detail") {
    await renderDetailView(route.recipeId);
  } else {
    renderListView();
  }
}

window.addEventListener("hashchange", () => {
  window.scrollTo(0, 0);
  renderRoute().catch(showFatalError);
});

function showFatalError(err) {
  console.error(err);
  statusEl.textContent = "Something went wrong: " + (err && err.message ? err.message : err);
  statusEl.classList.add("error");
}

// ---------- Boot ----------

(async () => {
  try {
    conn = await initDatabase();
    statusEl.textContent = "";
    await loadRecipeList();
    await renderRoute();
  } catch (err) {
    showFatalError(err);
    appEl.innerHTML = `
      <div class="empty-state">
        Could not load the recipe database. Open the browser console for details,
        and confirm data/tracker.duckdb exists next to this page (or ../data/tracker.duckdb
        when viewing this file locally from the repo).
      </div>`;
  }
})();
</script>
